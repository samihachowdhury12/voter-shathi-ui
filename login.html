<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voter's Friend Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f0f4f8;
      }
    </style>
  </head>

  <body class="flex min-h-screen items-center justify-center p-4">
    <div
      class="flex w-full max-w-4xl flex-col overflow-hidden rounded-xl bg-white shadow-2xl md:flex-row"
    >
      <!-- Left Image  -->
      <div class="hidden overflow-hidden md:block md:w-1/2">
        <img
          src="./images/image1.png"
          alt="Person casting a vote"
          class="h-full w-full object-cover object-left"
        />
      </div>

      <!-- Log In Form -->
      <div class="flex w-full flex-col justify-start p-8 pt-8 md:w-1/2 md:p-12">
        <!-- Back Button -->
        <div class="mb-4">
          <a href="#" class="inline-flex items-center text-sm text-gray-600 hover:text-gray-800">
            <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
            পেছনে ফেরত যান
          </a>
        </div>

        <!-- Logo + Wordmark  -->
        <div class="mb-3 flex items-center justify-center gap-1">
          <img src="./images/logo.svg" alt="Logo" class="h-6 w-6 md:h-8 md:w-8" />
          <span
            class="font-bangla text-base font-semibold leading-none tracking-tight text-gray-800 md:text-lg"
          >
            ভোটের সাথী
          </span>
        </div>

        <!-- Heading + Subtext -->
        <div class="mb-8 text-left">
          <h2 class="mb-1 text-sm font-bold text-[#1B1A34] md:text-base">
            আপনার একাউন্টে লগইন করুন
          </h2>

          <p class="text-xs leading-relaxed text-gray-500">
            আপনার প্রোফাইল দেখতে, প্রশ্ন করতে বা তথ্য আপডেট করতে লগইন করুন
          </p>
        </div>

        <!-- Login Form -->
        <form class="space-y-6">
          <!-- National ID Field -->
          <div>
            <label for="nid" class="block text-sm font-medium text-gray-700">
              জাতীয় পরিচয়পত্র নম্বর দিন
            </label>
            <div class="relative mt-1 rounded-lg shadow-sm">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                <svg
                  class="h-5 w-5 text-gray-400"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h10a2 2 0 002-2v-9a2 2 0 00-2-2h-5zM15 13a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </div>
              <input
                type="text"
                name="nid"
                id="nid"
                class="block w-full rounded-lg border border-gray-300 py-2 pl-10 pr-3 text-gray-900 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-teal-500"
                placeholder="১১০০০০০০০০"
                required
              />
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">
              পাসওয়ার্ড দিন
            </label>
            <div class="relative mt-1 rounded-lg shadow-sm">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                <svg
                  class="h-5 w-5 text-gray-400"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 15a3 3 0 100-6 3 3 0 000 6z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 9V7a5 5 0 00-5 5v2m10-2v-2a5 5 0 00-5-5"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 9a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </div>
              <input
                type="password"
                name="password"
                id="password"
                class="block w-full rounded-lg border border-gray-300 py-2 pl-10 pr-10 text-gray-900 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-teal-500"
                placeholder="********"
                required
              />
              <div
                class="absolute inset-y-0 right-0 flex cursor-pointer items-center pr-3"
                onclick="togglePasswordVisibility()"
              >
                <svg
                  id="togglePasswordIcon"
                  class="h-5 w-5 text-gray-400"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-.993 3.457-3.692 6-7.542 6-3.85 0-6.549-2.543-7.542-6z"
                  />
                </svg>
              </div>
            </div>
          </div>

          <!-- Login Button -->
          <div class="mt-6">
            <button
              type="submit"
              class="flex w-full justify-center rounded-lg border border-transparent bg-teal-600 px-4 py-3 text-sm font-medium text-white shadow-sm transition duration-300 ease-in-out hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2"
            >
              লগইন করুন
            </button>
          </div>
        </form>

        <!-- Registration Link -->
        <div class="mt-6 text-center">
          <p class="text-sm text-gray-600">
            আপনার একাউন্ট নেই?
            <a href="#" class="font-medium text-teal-600 hover:text-teal-500">রেজিস্ট্রেশন করুন</a>
          </p>
        </div>

        <!-- Use without login link -->
        <div class="mt-4 text-center">
          <a href="#" class="text-sm font-medium text-red-600 hover:text-red-700">
            লগইন ছাড়াই ব্যবহার করুন
          </a>
        </div>
      </div>
    </div>

    <script>
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("togglePasswordIcon");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.25a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.875 14.75h-.375a2.5 2.5 0 100 5h.375m2.5-5h-.375a2.5 2.5 0 100 5h.375" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9a3 3 0 100 6 3 3 0 000-6z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-.993 3.457-3.692 6-7.542 6-3.85 0-6.549-2.543-7.542-6z" />
                `;
        } else {
          passwordInput.type = "password";
          toggleIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-.993 3.457-3.692 6-7.542 6-3.85 0-6.549-2.543-7.542-6z" />
                `;
        }
      }
    </script>
  </body>
</html>
