<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter's Friend Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="flex flex-col md:flex-row bg-white rounded-xl shadow-2xl overflow-hidden max-w-4xl w-full">
        <!-- Left Section (Image) -->
        <div class="hidden md:block md:w-1/2 overflow-hidden">
            <img src="https://placehold.co/800x600/bde0f5/2b343b?text=Registration+Image" alt="Person casting a vote" class="w-full h-full object-cover">
        </div>

        <!-- Right Section (Registration Form) -->
        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
            <!-- Logo and Title -->
            <div class="flex items-center justify-center mb-8">
                <img src="./images/logo.svg" alt="Bangladesh Election Commission Logo" class="h-10 w-10 md:h-12 md:w-12 mr-3">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800">ভোটের সাথী</h1>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-xl md:text-2xl font-semibold text-gray-700">আপনার একাউন্ট তৈরি করুন</h2>
                <p class="text-sm text-gray-500 mt-2">সহজ কয়েকটি ধাপে নিবন্ধন সম্পন্ন করুন</p>
            </div>

            <!-- Registration Form -->
            <form class="space-y-6">
                <!-- National ID Field -->
                <div>
                    <label for="nid" class="block text-sm font-medium text-gray-700">জাতীয় পরিচয়পত্র নম্বর দিন</label>
                    <div class="mt-1 relative rounded-lg shadow-sm">
                        <input type="text" name="nid" id="nid" class="block w-full pl-3 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-gray-900" placeholder="১১০০০০০০০০" required>
                    </div>
                </div>

                <!-- Date of Birth and Mobile Number -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="dob" class="block text-sm font-medium text-gray-700">জন্ম তারিখ</label>
                        <div class="mt-1 flex space-x-2">
                            <input type="text" name="day" id="day" class="block w-1/3 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-center" placeholder="দিন" required>
                            <input type="text" name="month" id="month" class="block w-1/3 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-center" placeholder="মাস" required>
                            <input type="text" name="year" id="year" class="block w-1/3 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-center" placeholder="বছর" required>
                        </div>
                    </div>
                    <div>
                        <label for="mobile" class="block text-sm font-medium text-gray-700">মোবাইল নম্বর</label>
                        <div class="mt-1 relative rounded-lg shadow-sm">
                            <input type="text" name="mobile" id="mobile" class="block w-full pl-3 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-gray-900" placeholder="০১৬০০০০০০০০" required>
                        </div>
                    </div>
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">ইমেইল</label>
                    <div class="mt-1 relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-9 9l-7.2-4.8A2 2 0 003 14V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                            </svg>
                        </div>
                        <input type="email" name="email" id="email" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-gray-900" placeholder="test@testmail.com" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">পাসওয়ার্ড দিন</label>
                    <div class="mt-1 relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9V7a5 5 0 00-5 5v2m10-2v-2a5 5 0 00-5-5" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                        <input type="password" name="password" id="password" class="block w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-gray-900" placeholder="********" required>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePasswordVisibility('password')">
                            <svg id="togglePasswordIcon" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-.993 3.457-3.692 6-7.542 6-3.85 0-6.549-2.543-7.542-6z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700">পাসওয়ার্ড কনফার্ম করুন</label>
                    <div class="mt-1 relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9V7a5 5 0 00-5 5v2m10-2v-2a5 5 0 00-5-5" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                        <input type="password" name="confirm-password" id="confirm-password" class="block w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-gray-900" placeholder="********" required>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePasswordVisibility('confirm-password')">
                            <svg id="toggleConfirmPasswordIcon" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-.993 3.457-3.692 6-7.542 6-3.85 0-6.549-2.543-7.542-6z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- reCAPTCHA Placeholder -->
                <div class="flex items-center space-x-2 p-4 border border-gray-300 rounded-lg shadow-sm">
                    <input type="checkbox" id="recaptcha" name="recaptcha" class="form-checkbox h-5 w-5 text-teal-600 rounded">
                    <label for="recaptcha" class="text-sm text-gray-700">I'm not a robot</label>
                    <div class="ml-auto text-xs text-gray-400 text-right">
                        reCAPTCHA
                        <br>
                        <a href="#" class="text-blue-500">Privacy</a> - <a href="#" class="text-blue-500">Terms</a>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="mt-6">
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-300 ease-in-out">
                        সাবমিট করুন
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(id) {
            const passwordInput = document.getElementById(id);
            const toggleIcon = document.getElementById('toggle' + id.charAt(0).toUpperCase() + id.slice(1) + 'Icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.25a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.875 14.75h-.375a2.5 2.5 0 100 5h.375m2.5-5h-.375a2.5 2.5 0 100 5h.375" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9a3 3 0 100 6 3 3 0 000-6z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-.993 3.457-3.692 6-7.542 6-3.85 0-6.549-2.543-7.542-6z" />
                `;
            } else {
                passwordInput.type = 'password';
                toggleIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-.993 3.457-3.692 6-7.542 6-3.85 0-6.549-2.543-7.542-6z" />
                `;
            }
        }
    </script>
</body>
</html>
